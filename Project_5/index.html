<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Image Generation Report</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f3f4f6; }
    </style>
</head>
<body>

    <div class="container mx-auto p-4 md:p-8 max-w-6xl">
        <header class="text-center mb-12">
            <h1 class="text-4xl font-extrabold text-gray-900 mb-2">Image Generation and Embedding Report</h1>
            <p class="text-lg text-gray-600">Comparison of Image Size and Inference Steps</p>
            <div class="mt-4 text-sm font-mono p-2 bg-yellow-100 text-yellow-800 rounded-lg inline-block shadow-inner">
                <span class="font-bold">Project Random Seed: 428751</span>
            </div>
        </header>

        <!-- Repeatable Section Structure -->
        <template id="image-section-template">
            <section class="bg-white p-6 rounded-xl shadow-xl mb-10">
                <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-2 section-title"></h2>

                <!-- Grid container for the 3 outputs (will be side-by-side on desktop) -->
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

                    <!-- Output 1 -->
                    <div class="p-4 border rounded-lg shadow-sm">
                        <p class="font-semibold mb-2 text-indigo-700">Prompt 1:</p>
                        <p class="text-xs italic text-gray-700 mb-3 font-mono bg-gray-100 p-2 rounded h-16 overflow-hidden">
                            A hyper-realistic photograph of a lone, ancient lighthouse on a rugged cliff overlooking a neon purple ocean at sunset, cinematic lighting, 8k.
                        </p>
                        <!-- Actual Photo Placement - SRC will be set by JS -->
                        <div class="rounded-lg mb-3 overflow-hidden border border-gray-200 aspect-video">
                            <img src="" 
                                alt="Generated image output" 
                                class="w-full h-auto object-cover rounded-lg image-placeholder">
                        </div>
                        <!-- End Actual Photo Placement -->
                        <p class="mt-4 text-xs text-gray-600">
                            <span class="font-bold">Reflection:</span> Describe the quality of the output and its relationship to the prompt here.
                            The image was generated with <span class="steps-text font-mono"></span>.
                        </p>
                    </div>

                    <!-- Output 2 -->
                    <div class="p-4 border rounded-lg shadow-sm">
                        <p class="font-semibold mb-2 text-indigo-700">Prompt 2:</p>
                        <p class="text-xs italic text-gray-700 mb-3 font-mono bg-gray-100 p-2 rounded h-16 overflow-hidden">
                            A whimsical watercolor illustration of a group of friendly space aliens playing chess on the surface of the moon, stylized, low detail.
                        </p>
                        <!-- Actual Photo Placement - SRC will be set by JS -->
                        <div class="rounded-lg mb-3 overflow-hidden border border-gray-200 aspect-video">
                            <img src="" 
                                alt="Generated image output" 
                                class="w-full h-auto object-cover rounded-lg image-placeholder">
                        </div>
                        <!-- End Actual Photo Placement -->
                        <p class="mt-4 text-xs text-gray-600">
                            <span class="font-bold">Reflection:</span> Describe the quality of the output and its relationship to the prompt here.
                            The image was generated with <span class="steps-text font-mono"></span>.
                        </p>
                    </div>

                    <!-- Output 3 -->
                    <div class="p-4 border rounded-lg shadow-sm">
                        <p class="font-semibold mb-2 text-indigo-700">Prompt 3:</p>
                        <p class="text-xs italic text-gray-700 mb-3 font-mono bg-gray-100 p-2 rounded h-16 overflow-hidden">
                            A minimalist abstract sculpture made of polished stainless steel, reflecting a bustling cityscape, high contrast, black and white.
                        </p>
                        <!-- Actual Photo Placement - SRC will be set by JS -->
                        <div class="rounded-lg mb-3 overflow-hidden border border-gray-200 aspect-video">
                            <img src="" 
                                alt="Generated image output" 
                                class="w-full h-auto object-cover rounded-lg image-placeholder">
                        </div>
                        <!-- End Actual Photo Placement -->
                        <p class="mt-4 text-xs text-gray-600">
                            <span class="font-bold">Reflection:</span> Describe the quality of the output and its relationship to the prompt here.
                            The image was generated with <span class="steps-text font-mono"></span>.
                        </p>
                    </div>

                </div>
            </section>
        </template>
        <!-- End Repeatable Section Structure -->


        <!-- Dynamic Content Insertion -->
        <div id="report-content">
            <!-- Sections will be inserted here by JavaScript -->
        </div>

    </div>

    <script>
        const sections = [
            { title: "Small Images ($\text{num\_inference\_steps}=10$)", size_label: "1", size_display: "Small (Size 1)", steps: 10 },
            { title: "Large Images ($\text{num\_inference\_steps}=10$)", size_label: "2", size_display: "Large (Size 2)", steps: 10 },
            { title: "Small Images ($\text{num\_inference\_steps}=20$)", size_label: "1", size_display: "Small (Size 1)", steps: 20 },
            { title: "Large Images ($\text{num\_inference\_steps}=20$)", size_label: "2", size_display: "Large (Size 2)", steps: 20 },
        ];

        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('report-content');
            const template = document.getElementById('image-section-template');

            sections.forEach(data => {
                const clone = template.content.cloneNode(true);
                
                // Set the section title
                clone.querySelector('.section-title').textContent = data.title;

                // Update images and reflection texts
                // Select all three image containers within the cloned section
                const imageContainers = clone.querySelectorAll('.p-4.border.rounded-lg.shadow-sm');
                
                imageContainers.forEach((container, index) => {
                    const sampleIndex = index + 1; // 1, 2, or 3
                    const img = container.querySelector('img');
                    const stepsSpan = container.querySelector('.steps-text');
                    
                    // 1. Construct the file path using the updated naming convention (size_label is now '1' or '2')
                    const imageSizeName = data.size_label; // '1' or '2'
                    const fileName = `./output_images/stage_${imageSizeName}_sample_${sampleIndex}_${data.steps}.png`;

                    // 2. Set the image source
                    img.src = fileName;
                    
                    // 3. Update alt text to include size and steps
                    img.alt = `Generated image output for Prompt ${sampleIndex} (Size: ${imageSizeName}, Steps: ${data.steps})`;
                    
                    // 4. Update the onerror fallback to show the missing file path
                    const fallbackText = `File Not Found:\\n${data.size_display} | Steps ${data.steps} | Sample ${sampleIndex}`;
                    img.setAttribute('onerror', `this.onerror=null; this.src='https://placehold.co/600x400/F0F0F0/333333?text=${encodeURIComponent(fallbackText)}'`);
                    
                    // 5. Update the reflection steps text
                    stepsSpan.innerHTML = `$\\text{num\\_inference\\_steps}=${data.steps}$.`;
                });

                container.appendChild(clone);
            });
            
            // Remove the template element from the visible DOM after use
            template.remove();
        });
    </script>
</body>
</html>
